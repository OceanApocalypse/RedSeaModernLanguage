name: Publish and release

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Run the workflow in Debug Mode (skips NuGet and GitHub release)."
        required: true
        type: boolean
        default: false
      run_sonar:
        description: "Analyze with Sonar and fail if quality gate fails. If set to false, also skips past testing."
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:

  # Extracts the version from the project properties or the tag name.
  extract-version:
    name: Extract version variable
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.set-semver-var.outputs.semver }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: set-semver-var
        name: Set version variable
        shell: pwsh
        run: ./.github/workflows/scripts/set-semver-var.ps1 -RefType "${{ github.ref_type }}" -RefName "${{ github.ref_name }}"

  # Performs an analysis with Sonar.
  sonar-analysis:
    name: Analyze with Sonar
    needs: extract-version
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SEMVER: ${{ needs.extract-version.outputs.semver }}
    steps:
      - name: Checkout repo
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'

      - name: Setup JDK
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Restore solution
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        run: dotnet restore

      - name: Cache SonarQube Cloud packages
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        id: cache-sonar-scanner
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && (github.ref_type == 'tag' || inputs.run_sonar == true)
        run: |
          mkdir -p ${{ runner.temp }}/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Begin analysis
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin \
            /k:"oas_RedSeaModernLanguage" \
            /o:"oas" \
            /v:"${{ env.SEMVER }}" \
            /d:sonar.token="${{ env.SONAR_TOKEN }}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/**/*.xml" \
            /d:sonar.exclusions="**/*.png,**/*.jpg,**/*.jpeg,**/*.ico,**/*.gif" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=90

      - name: Build solution in Debug mode
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        run: dotnet build --configuration Debug --no-restore

      - name: Test with coverage output
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        run: dotnet test --framework net10.0 --configuration Debug --no-build -- --coverage --coverage-output-format xml

      - name: End analysis (fail if quality gate fails)
        if: github.ref_type == 'tag' || inputs.run_sonar == true
        run: ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

  # Builds necessary binaries with Native AOT compilation.
  build-native-aot:
    name: Build binaries (Native AOT)
    needs: sonar-analysis

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            rid-os: linux
          - os: ubuntu-latest
            arch: arm64
            rid-os: linux
          - os: ubuntu-latest
            arch: arm
            rid-os: linux

          - os: windows-latest
            arch: x64
            rid-os: win
          - os: windows-latest
            arch: x86
            rid-os: win
          - os: windows-latest
            arch: arm64
            rid-os: win

          - os: macos-latest
            arch: x64
            rid-os: osx
          - os: macos-latest
            arch: arm64
            rid-os: osx

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x.x'

    - name: Restore solution
      run: dotnet restore

    - name: Install Linux ARM compilation toolchain
      if: matrix.rid-os == 'linux' && matrix.arch == 'arm'
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils-arm-linux-gnueabihf gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

    - name: Install Linux ARM64 compilation toolchain
      if: matrix.rid-os == 'linux' && matrix.arch == 'arm64'
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Publish Native Project
      shell: pwsh
      run: ./.github/workflows/scripts/publish-native-aot.ps1 'RSML.Native' "${{ matrix.rid-os }}" "${{ matrix.arch }}"

    - name: Publish CLI Project
      shell: pwsh
      run: ./.github/workflows/scripts/publish-native-aot.ps1 'RSML.CLI' "${{ matrix.rid-os }}" "${{ matrix.arch }}"

    - name: Build hybrid CLI
      shell: pwsh
      run: ./.github/workflows/scripts/build-hybrid-cli.ps1 "${{ matrix.rid-os }}" "${{ matrix.arch }}"

    - name: Upload native artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rsml-native-${{ matrix.rid-os }}-${{ matrix.arch }}
        path: ./dist/RSML.Native-${{ matrix.rid-os }}-${{ matrix.arch }}
        if-no-files-found: error
        
    - name: Upload CLI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rsml-cli-${{ matrix.rid-os }}-${{ matrix.arch }}
        path: ./dist/RSML.CLI-${{ matrix.rid-os }}-${{ matrix.arch }}
        if-no-files-found: error
        
    - name: Upload hybrid CLI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rsml-cli-hybrid
        path: ./dist/RSML.CLI-hybrid
        if-no-files-found: error

  publish:
    name: Publish on NuGet, GitHub Packages and Codeberg Packages
    needs: [build-native-aot, extract-version, sonar-analysis]
    runs-on: ubuntu-latest

    env:
      SEMVER: ${{ needs.extract-version.outputs.semver }}

    permissions:
      id-token: write
      contents: write
      packages: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: rsml-cli-hybrid
          path: ./nupkgs
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'

      - name: Restore solution
        run: dotnet restore

      - name: Build solution in Release mode
        run: dotnet build --configuration Release --no-restore

      - name: Pack projects
        run: |
          dotnet pack ./src/RSML.CLI/RSML.CLI.csproj -p:IsPackable=true --output ./hybrid
          dotnet pack ./src/RSML.CLI/RSML.CLI.csproj -r any -p:PublishAot=false -p:IsPackable=true --output ./hybrid
          dotnet pack --configuration Release --no-build --output ./nupkgs

      - name: Login to NuGet
        if: github.ref_type == 'tag' || inputs.debug_mode != true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: github.ref_type == 'tag' || inputs.debug_mode != true
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Push hybrid CLI to NuGet
        if: github.ref_type == 'tag' || inputs.debug_mode != true
        run: |
          dotnet nuget push "./hybrid/*.CLI.${{ env.SEMVER }}*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source "https://api.nuget.org/v3/index.json"

          dotnet nuget push "./hybrid/*.CLI.*.${{ env.SEMVER }}*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Push to GitHub Packages
        if: github.ref_type == 'tag' || inputs.debug_mode != true
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key ${{ env.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/OceanApocalypse/index.json" \
            --skip-duplicate

      - name: Push to Codeberg Packages
        if: github.ref_type == 'tag' || inputs.debug_mode != true
        env: 
          CODEBERG_PACKAGES_TOKEN: ${{ secrets.CODEBERG_PACKAGES_TOKEN }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key ${{ env.CODEBERG_PACKAGES_TOKEN }} \
            --source "https://codeberg.org/api/packages/oas/nuget/index.json" \
            --skip-duplicate

  # Release on NuGet and GitHub.
  deploy:
    permissions:
      id-token: write
      contents: write

    needs: [extract-version, build-native-aot, publish]
    runs-on: ubuntu-latest

    env:
      SEMVER: ${{ needs.extract-version.outputs.semver }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./all-binaries

    - name: Generate changelog
      run: |
        npx git-cliff@latest -o ${{ github.workspace }}-CHANGELOG.md --latest
        cat ${{ github.workspace }}-CHANGELOG.md
        
    - name: Prepare release assets
      shell: pwsh
      run: ./.github/workflows/scripts/prepare-assets.ps1

    - name: Create GitHub Release
      if: github.ref_type == 'tag' || inputs.debug_mode != true
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # 3.0.2
      with:
        files: ./release-assets/*.tar.gz
        body_path: ${{ github.workspace }}-CHANGELOG.md
        name: RSML ${{ env.SEMVER }}
